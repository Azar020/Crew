<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#F3E8D6" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crew — Workforce Workspace by Transacty</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('crew_theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
